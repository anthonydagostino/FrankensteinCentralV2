name: CI

# Tier 1 is the merge gate: deterministic checks on every push and pull request.
# Tier 2 (claude-review, last job) is advisory and runs only on pull requests after Tier 1 is green.

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# A newer commit on the same branch makes the running checks irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MOCK_MODE: "true"

jobs:
  backend:
    # One job per check so a type error still lets the tests report.
    name: backend ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        check: [format, lint, types, test]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - name: ${{ matrix.check }}
        run: |
          case "${{ matrix.check }}" in
            format) uv run ruff format --check . ;;
            lint)   uv run ruff check . ;;
            types)  uv run mypy app ;;
            test)   uv run pytest -q --cov=app --cov-report=xml:coverage.xml --cov-report=term ;;
          esac
      - if: matrix.check == 'test' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: frontend ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        check: [format, lint, types, test]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ${{ matrix.check }}
        run: |
          case "${{ matrix.check }}" in
            format) npx prettier --check . ;;
            lint)   npx eslint . --max-warnings 0 ;;
            types)  npx tsc -b ;;
            test)   npx vitest run --coverage --coverage.reporter=text --coverage.reporter=lcov ;;
          esac
      - if: matrix.check == 'test' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: ignore

  vulnerabilities:
    # One scanner for both lockfiles so the severity policy is the same everywhere.
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-dirs: frontend/node_modules,backend/.venv

  secrets:
    # Scans the commits in the push or pull request, not just the tree.
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: "false"

  build:
    # The image is the production artifact; building it proves the Dockerfile and both build chains still work.
    name: docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  claude-review:
    # Tier 2: advisory review. Every step continues on error so the job is never red,
    # and GITHUB_TOKEN with contents: read keeps Claude unable to commit or push.
    # Without the ANTHROPIC_API_KEY secret the job only prints a notice.
    name: Claude review (advisory)
    needs: [backend, frontend, vulnerabilities, secrets, build]
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
      BASE: ${{ github.event.pull_request.base.ref }}
      CLAUDE_ENABLED: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - if: env.CLAUDE_ENABLED != 'true'
        run: echo "::notice::ANTHROPIC_API_KEY is not set, so the Claude review is skipped"
      - name: Skip diffs that only touch docs or lockfiles; take the prompt from the base branch
        id: scope
        continue-on-error: true
        run: |
          git diff --name-only "origin/$BASE...HEAD" \
            | grep -vE '\.(md|txt)$|^docs/|^LICENSE|(^|/)(package-lock\.json|uv\.lock)$' > changed.txt || true
          echo "code=$([ -s changed.txt ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          {
            echo 'prompt<<PROMPT_EOF'
            echo "REPO: $GITHUB_REPOSITORY"
            echo "PR NUMBER: $PR"
            echo "BASE BRANCH: $BASE"
            echo "Get the diff with: gh pr diff $PR. Post each finding with the inline comment tool on the exact line."
            echo "If nothing is worth raising, post one comment with: gh pr comment $PR --body '<!-- claude-diff-review --> ...'"
            echo
            git show "origin/$BASE:.ci/prompts/diff-review.md" 2>/dev/null || cat .ci/prompts/diff-review.md
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Remove this job's comments from the previous push
        if: env.CLAUDE_ENABLED == 'true' && steps.scope.outputs.code == 'true'
        continue-on-error: true
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | .id' \
            | xargs -r -I{} gh api -X DELETE "repos/$GITHUB_REPOSITORY/pulls/comments/{}"
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("claude-diff-review"))) | .id' \
            | xargs -r -I{} gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/{}"
      - if: env.CLAUDE_ENABLED == 'true' && steps.scope.outputs.code == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ steps.scope.outputs.prompt }}
          claude_args: >-
            --max-turns 40
            --max-budget-usd 3
            --allowedTools "Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Edit,Write,MultiEdit,NotebookEdit,Bash(git push:*),Bash(git commit:*),Bash(git add:*)"
